name: AxLang

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate AxLang configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true

      - name: Install AxLang compiler
        run: go install github.com/vivek5200/axlang/cmd/axc@v0.3.0

      - name: Validate configuration
        run: axc check Astrixfile.ax
